# CaP-Bench++ LIBERO-PRO Agent0 baseline with direct MiniMax-M3 VLM input.
# MiniMax is the only coding model. RGB frames are sent directly to it; no
# 9-temperature ensemble, multimodel synthesis, or VDM image differencing is
# used. Keep this file as the canonical default for local M3 smoke/benchmark
# runs.
# Usage:
#   uv run capx/envs/launch.py --config-path env_configs/libero/franka_libero_cap_agent0.yaml

env:
  _target_: capx.envs.tasks.franka.franka_libero_env.FrankaLiberoCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level:
      _target_: capx.envs.simulators.libero.FrankaLiberoEnv
      suite_name: libero_object_swap
      task_id: 0
      privileged: false
      max_steps: 8000
      control_freq: 20
    privileged: false
    apis:
      - FrankaLiberoApiReducedSkillLibrary
    prompt: |
      You are controlling a Franka Emika robot with API described below.
      Goal: {libero_environment_goal}
      You may write python code comments for reasoning but ONLY write the executable Python code and do not write it in code fences.
      After this code executes, you will be able to get a new observation of the environment and write new code to complete the task if needed.
      The functions (APIs) below are already imported to the environment. If you want to use numpy, you need to import it explicitly.

    multi_turn_prompt: |
      The following code blocks were just executed:
      ```python
      {executed_code}
      ```
      The current console stdout is:
      ```
      {console_stdout}
      ```
      The current console stderr is:
      ```
      {console_stderr}
      ```
      If there were no errors during compilation or execution, the console stderr will be empty. If there were errors, consider regenerating the code.
      IMPORTANT: The instruction to output bare Python without code fences applied only to the initial response. On this and every later turn, follow the decision format below exactly. If the task is not complete, further robot actions are needed, or an error needs correction, respond with REGENERATE. Do not output Python on a later turn unless it is preceded by REGENERATE.
      Please respond with EXACTLY ONE of the following:
      - The word 'REGENERATE' followed immediately by new Python code in a fenced code block (```python...```) if you want to modify the code.
      - The word 'FINISH' only if the current observation indicates that the task is complete and no further action is needed

api_servers:
  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand

  - _target_: capx.serving.launch_contact_graspnet_server.main
    port: 8115
    host: 127.0.0.1

  - _target_: capx.serving.launch_sam3_server.main
    device: cuda
    port: 8114
    host: 127.0.0.1

record_video: true
output_dir: ./outputs/franka_libero_cap_agent0
use_visual_feedback: true
use_img_differencing: false
use_video_differencing: false
use_wrist_camera: false
use_legacy_multi_turn_decision_prompt: false
use_parallel_ensemble: false
use_multimodel: false

model: MiniMax-M3
server_url: https://api.minimax.io/v1/chat/completions
temperature: 1.0
max_tokens: 8192
max_trial_attempts: 1

trials: 50
num_workers: 10
